# Model registry. Each entry validates as axiom.config.ModelConfig.
# `hf_path` is what HuggingFace from_pretrained reads (local dir or hub id);
# `tl_name` is the TransformerLens architecture name used to wrap it.
#
# Local development / smoke tests use gpt2 on MPS or CPU. Pod runs use the local
# Llama checkpoint under models/ on CUDA. The slug of `name` determines the output
# subtree (outputs/<model_slug>/...), so gpt2 smoke results never collide with pod runs.

gpt2:
  name: gpt2
  hf_path: gpt2
  tl_name: gpt2
  family: gpt2
  device: auto
  dtype: float32          # gpt2 is tiny; float32 is safe + deterministic on MPS/CPU
  prepend_bos: true
  padding_side: right

llama31-8b:
  name: meta-llama/Llama-3.1-8B
  hf_path: meta-llama/Llama-3.1-8B   # HuggingFace hub id (gated: needs HF auth + license acceptance)
  tl_name: meta-llama/Llama-3.1-8B
  family: llama
  device: cuda            # demand GPU: an 8B model on CPU is unusable, so fail loudly if CUDA is unavailable
  dtype: float16
  prepend_bos: true
  padding_side: right

# To use a locally-downloaded checkpoint instead of the hub, set hf_path to its path,
# e.g. hf_path: models/Llama-3.1-8B (keep tl_name as the hub id so TransformerLens
# recognizes the architecture).
