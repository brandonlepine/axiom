[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom"
version = "0.1.0"
description = "Mechanistic-interpretability pipelines for social-bias analysis across Wino-style datasets."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools]
packages = ["axiom"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so `import axiom` works without an editable install.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
